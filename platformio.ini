[platformio]
default_envs = reterminal_e1001

[env:reterminal_e1001]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_ldf_mode = deep
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D BOARD_HAS_PSRAM
  -D ARDUINO_RETERMINAL_E1001
  -D BOARD_SCREEN_COMBO=520
  -D CORE_DEBUG_LEVEL=2
  -D PRELUDE_CONTROLLER_WHITELIST=1
  -I src
lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX
  h2zero/NimBLE-Arduino@^2.5.1

[env:native]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall -Wextra
